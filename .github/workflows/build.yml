name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Run tests
        run: clojure -X:test

  native-image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: cljp
          - os: macos-latest
            binary: cljp
          - os: windows-latest
            binary: cljp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1.6.8
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # windows-latest ships MSVC Build Tools but doesn't put cl.exe/link.exe
      # on PATH by default; native-image needs them to link the executable.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Build native binary
        shell: bash
        run: script/native-image.sh

      - name: Smoke test
        shell: bash
        run: |
          ./${{ matrix.binary }} help
          ./${{ matrix.binary }} new smoke-test --dir "${RUNNER_TEMP}/smoke-test"
          test -f "${RUNNER_TEMP}/smoke-test/deps.edn"

      - uses: actions/upload-artifact@v7
        with:
          name: cljp-${{ runner.os }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # Only on a `vX.Y.Z` tag push: gather the three binaries built above and
  # publish them as assets on a GitHub Release.
  release:
    needs: native-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Stage release assets
        run: |
          mkdir -p release
          cp dist/cljp-Linux/cljp release/cljp-linux-x86_64
          cp dist/cljp-macOS/cljp release/cljp-macos-arm64
          cp dist/cljp-Windows/cljp.exe release/cljp-windows-x86_64.exe
          chmod +x release/cljp-linux-x86_64 release/cljp-macos-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
